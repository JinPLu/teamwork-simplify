checkpoint_path: docs/teamwork/<kind>/<slug>.md
kind_root: docs/teamwork/<kind>/
kinds:
  - discussions
  - plans
  - records
  - experiments
kind_meanings:
  discussions:
    label: Discussion
    emoji: "💬"
    meaning: options, trade-offs, settled choices, rejected alternatives, and open questions
    meaning_zh: 选项、权衡、已定选择、被否决的方案与仍待决定的问题
  plans:
    label: Plan
    emoji: "📝"
    meaning: executable steps, dependencies, parallel lines and Worker dispatch, verification, and stop conditions for a selected direction
    meaning_zh: 已选方向的可执行步骤、依赖、并行线与 Worker 分派、验证和停止条件
  records:
    label: Record
    emoji: "📌"
    meaning: reusable results, conclusions, and blockers that carry across sessions
    meaning_zh: 可跨会话复用的结果、结论与阻塞
  experiments:
    label: Experiment
    emoji: "🧪"
    meaning: one trial's claim, setup, actual run, result, and conclusion
    meaning_zh: 一次试验的说法、设置、实际运行、结果与结论
hosts:
  claude:
    skills: 1
    roles: 3
  cursor:
    skills: 1
    roles: 3
  codex:
    skills: 1
    roles: 3
